<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unit 2 – Vocabulary and Grammar</title>
<style>
:root{--bg:#fff7e6;--card:#fff;--ink:#2b2d42;--pri:#ff6b6b;--blue:#4dabf7;--ok:#2fbf71;--bad:#e8505b;--yel:#ffd43b}
@media (prefers-color-scheme:dark){:root{--bg:#1d2236;--card:#2a3150;--ink:#f1f3ff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:12px;user-select:none}
header{text-align:center;max-width:1000px;margin:0 auto}
.school{font-size:14px;opacity:.75}
h1{margin:4px 0;font-size:clamp(22px,4vw,34px);color:var(--pri)}
.sub{font-size:18px;font-weight:bold}
.info{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.info input{font:inherit;padding:8px 12px;border-radius:12px;border:2px solid var(--blue);background:var(--card);color:var(--ink);width:210px}
.bank{position:sticky;top:0;z-index:20;max-width:1000px;margin:8px auto;background:var(--card);border:3px dashed var(--blue);border-radius:18px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;box-shadow:0 4px 12px #0002;min-height:60px}
.chip{background:var(--yel);color:#2b2d42;border:3px solid #f59f00;border-radius:14px;padding:8px 12px;font-size:clamp(15px,2.6vw,20px);font-weight:bold;cursor:grab;touch-action:none;transition:transform .15s}
.chip:active{transform:scale(1.08)}
.chip.sel{outline:4px solid var(--pri);transform:scale(1.1)}
.chip.used{opacity:.25;pointer-events:none}
.chip.fly{position:fixed;z-index:999;pointer-events:none;margin:0}
.grid{max-width:1000px;margin:10px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:620px){.grid{grid-template-columns:repeat(2,1fr)}}
.cell{background:var(--card);border-radius:18px;border:3px solid #dee2e6;padding:8px;text-align:center;position:relative;transition:.2s}
.cell .n{position:absolute;top:6px;left:10px;font-weight:bold;background:var(--blue);color:#fff;border-radius:50%;width:30px;height:30px;line-height:30px}
.cell img{width:100%;border-radius:12px;background:#fff;display:block}
.slot{margin:8px auto 2px;width:70%;min-height:48px;border:3px dashed #adb5bd;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;cursor:pointer;background:#f8f9fa;color:#2b2d42}
.slot.over{border-color:var(--pri);background:#ffe3e3;transform:scale(1.05)}
.slot .chip{margin:0;cursor:pointer;font-size:16px;padding:4px 8px}
.cell.ok{border-color:var(--ok);background:#e6fcf5}
.cell.ok .slot{border-color:var(--ok);background:#d3f9d8}
.cell.no{border-color:var(--bad);animation:shake .5s}
.cell.no .slot{border-color:var(--bad);background:#ffe3e3}
.fb{font-size:13px;min-height:18px;font-weight:bold}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
@keyframes pop{50%{transform:scale(1.07)}}
.cell.ok{animation:pop .4s}
.bar{max-width:1000px;margin:14px auto;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button.b{font:inherit;font-weight:bold;font-size:18px;border:0;border-radius:16px;padding:12px 22px;color:#fff;cursor:pointer;box-shadow:0 5px 0 #0003}
button.b:active{transform:translateY(3px);box-shadow:0 2px 0 #0003}
.b.c{background:var(--ok)}.b.r{background:var(--pri)}.b.h{background:var(--blue)}
#score{text-align:center;font-size:24px;font-weight:bold;margin:8px}
.prog{max-width:1000px;margin:6px auto;height:14px;background:#dee2e6;border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--ok));transition:width .4s}
footer{text-align:center;margin:18px 0 6px;font-size:14px;opacity:.8}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
#modal .box{background:var(--card);border-radius:26px;padding:26px;text-align:center;max-width:380px;animation:pop .5s}
#modal .big{font-size:64px}
canvas{position:fixed;inset:0;pointer-events:none;z-index:1100}
</style></head><body>

const WORDS={A:'dive',B:'roar',C:'fly away',D:'bite',E:'curl up',F:'die',G:'fight',H:'hide',I:'sting',J:'lay eggs',K:'run away',L:'dig'};
const ANS=['B','H','L','D','J','K','E','I','G','A','F','C'];
const place={}; // slot index -> letter
let sel=null,checked=false;
const bank=document.getElementById('bank'),grid=document.getElementById('grid');
let ac;function snd(f,d=.15,t='sine',v=.15,when=0){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);const s=ac.currentTime+when;o.start(s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.stop(s+d)}catch(e){}}
const good=()=>[523,659,784].forEach((f,i)=>snd(f,.2,'triangle',.18,i*.09));
const badS=()=>{snd(200,.25,'sawtooth',.12);snd(150,.3,'sawtooth',.12,.12)};
const pick=()=>snd(660,.08,'square',.08);
function chip(l){const c=document.createElement('div');c.className='chip';c.dataset.l=l;c.textContent=l+'. '+WORDS[l];return c}
Object.keys(WORDS).forEach(l=>{const c=chip(l);bank.appendChild(c);wire(c)});
ANS.forEach((a,i)=>{const d=document.createElement('div');d.className='cell';d.id='c'+i;
d.innerHTML=`<span class="n">${i+1}</span><img src="${IMGS[i]}" alt="picture ${i+1}"><div class="slot" data-i="${i}"></div><div class="fb"></div>`;grid.appendChild(d);
const s=d.querySelector('.slot');s.addEventListener('click',()=>slotClick(i))});
function bankChip(l){return [...bank.children].find(c=>c.dataset.l===l)}
function wire(c){
 c.addEventListener('click',e=>{if(c.parentElement.classList.contains('slot')){ if(checked)return; removeFrom(c.parentElement.dataset.i);return}
  if(sel)sel.classList.remove('sel');sel=(sel===c)?null:c;if(sel)sel.classList.add('sel');pick()});
 let drag=null,sx,sy,moved=false;
 c.addEventListener('pointerdown',e=>{if(c.classList.contains('used')||c.parentElement.classList.contains('slot'))return;sx=e.clientX;sy=e.clientY;moved=false;drag={id:e.pointerId};c.setPointerCapture(e.pointerId)});
 c.addEventListener('pointermove',e=>{if(!drag)return;if(!moved&&Math.hypot(e.clientX-sx,e.clientY-sy)<8)return;
  if(!moved){moved=true;c._g=c.cloneNode(true);c._g.classList.add('fly');document.body.appendChild(c._g)}
  c._g.style.left=(e.clientX-40)+'px';c._g.style.top=(e.clientY-25)+'px';
  document.querySelectorAll('.slot').forEach(s=>s.classList.remove('over'));
  const t=slotAt(e.clientX,e.clientY);if(t)t.classList.add('over')});
 c.addEventListener('pointerup',e=>{if(!drag)return;drag=null;document.querySelectorAll('.slot').forEach(s=>s.classList.remove('over'));
  if(moved){const t=slotAt(e.clientX,e.clientY);c._g.remove();if(t){e.preventDefault();c.dataset.skip=1;setTimeout(()=>delete c.dataset.skip);putIn(+t.dataset.i,c.dataset.l)}
   const stop=ev=>{ev.stopImmediatePropagation();ev.preventDefault()};c.addEventListener('click',stop,{once:true,capture:true})}});
}
function slotAt(x,y){const els=document.elementsFromPoint(x,y);const s=els.find(e=>e.classList&&e.classList.contains('slot'));if(s)return s;const cell=els.find(e=>e.classList&&e.classList.contains('cell'));return cell?cell.querySelector('.slot'):null}
function slotClick(i){if(checked)return;if(sel){putIn(i,sel.dataset.l)}else if(place[i]){removeFrom(i)}}
function putIn(i,l){if(checked)return;if(place[i])removeFrom(i,true);
 // move letter from another slot if already used
 for(const k in place){if(place[k]===l)removeFrom(k,true)}
 place[i]=l;const s=document.querySelector(`.slot[data-i="${i}"]`);s.innerHTML='';const c=chip(l);wire(c);s.appendChild(c);
 bankChip(l).classList.add('used');if(sel){sel.classList.remove('sel');sel=null}pick();upd()}
function removeFrom(i,silent){const l=place[i];if(!l)return;delete place[i];document.querySelector(`.slot[data-i="${i}"]`).innerHTML='';bankChip(l).classList.remove('used');if(!silent)pick();upd()}
function upd(){document.getElementById('pg').style.width=Object.keys(place).length/12*100+'%'}
function check(){
 if(Object.keys(place).length<12){document.getElementById('score').textContent='Fill all 12 boxes first 🙂';badS();return}
 checked=true;let s=0;
 ANS.forEach((a,i)=>{const cell=document.getElementById('c'+i),fb=cell.querySelector('.fb');cell.classList.remove('ok','no');void cell.offsetWidth;
  if(place[i]===a){s++;cell.classList.add('ok');fb.textContent='✔ '+a+'. '+WORDS[a]}else{cell.classList.add('no');fb.textContent='✘ Correct: '+a+'. '+WORDS[a]}});
 document.getElementById('score').innerHTML=`Score: <span style="color:var(--ok)">${s}</span> / 12 ${'⭐'.repeat(Math.round(s/12*5))}`;
 s>=10?good():badS();
 const nm=document.getElementById('nm').value.trim();
 const msg=s===12?['🏆','Perfect!','Amazing work'+(nm?', '+nm:'')+'!']:s>=9?['🌟','Great job!','Almost perfect – '+s+'/12']:s>=6?['👍','Good try!','You got '+s+'/12. Try again!']:['💪','Keep going!','You got '+s+'/12. Look at the correct answers and try again.'];
 document.getElementById('mi').textContent=msg[0];document.getElementById('mt').textContent=msg[1];document.getElementById('mp').textContent=msg[2];
 document.getElementById('modal').style.display='flex';if(s>=10)confetti()}
function hint(){if(checked)return;const i=ANS.findIndex((a,k)=>place[k]!==a);if(i<0)return;const c=document.getElementById('c'+i);c.scrollIntoView({behavior:'smooth',block:'center'});c.style.boxShadow='0 0 0 6px var(--yel)';setTimeout(()=>c.style.boxShadow='',1500);pick();document.querySelector(`#c${i} .fb`).textContent='💡 Starts with: '+WORDS[ANS[i]][0].toUpperCase();}
function resetAll(){checked=false;sel=null;for(const k in place)delete place[k];document.querySelectorAll('.slot').forEach(s=>s.innerHTML='');document.querySelectorAll('.chip.used').forEach(c=>c.classList.remove('used','sel'));document.querySelectorAll('.cell').forEach(c=>{c.classList.remove('ok','no');c.querySelector('.fb').textContent=''});document.getElementById('score').textContent='';upd();window.scrollTo({top:0,behavior:'smooth'})}
function confetti(){const cv=document.getElementById('cv'),x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;const P=[...Array(120)].map(()=>({x:Math.random()*cv.width,y:-20-Math.random()*200,v:2+Math.random()*4,r:4+Math.random()*6,c:`hsl(${Math.random()*360},90%,60%)`,w:Math.random()*6}));let f=0;(function a(){x.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.y/20+p.w);x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*1.6)});if(++f<200)requestAnimationFrame(a);else x.clearRect(0,0,cv.width,cv.height)})()}
